; PlatformIO Project Configuration File
; HomeLab SESAME Smart Lock Controller - ESP32 Firmware

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial monitor speed
monitor_speed = 115200

; Upload speed
upload_speed = 921600

; Library dependencies
lib_deps =
    bblanchon/ArduinoJson@^7
    knolleary/PubSubClient@^2.8
    h2zero/NimBLE@^2.0
    micro-ecc/micro-ecc@^1.0
    https://github.com/homy-newfs8/libsesame3bt#0.33.0

; Build flags (MBEDTLS_CMAC required by libsesame3bt)
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DHOMELAB_VERSION=\"0.1.0\"
    -DCONFIG_MBEDTLS_CMAC_C
    -DUSE_FRAMEWORK_MBEDTLS_CMAC

; Partition scheme (OTA support)
board_build.partitions = default.csv
