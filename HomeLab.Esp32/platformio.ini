; PlatformIO Project Configuration File
; HomeLab SESAME Smart Lock Controller - ESP32 Firmware

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial monitor speed
monitor_speed = 115200

; Upload speed
upload_speed = 921600

; Library dependencies
lib_deps =
    bblanchon/ArduinoJson@^7
    https://github.com/Links2004/arduinoWebSockets.git#2.4.1
    h2zero/NimBLE-Arduino@^2.0
    kmackay/micro-ecc@1.0.0
    https://github.com/homy-newfs8/libsesame3bt#0.33.0

; Build flags (MBEDTLS_CMAC required by libsesame3bt)
build_unflags =
    -std=gnu++11
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
    -DHOMELAB_VERSION=\"0.1.0\"
    -DCONFIG_MBEDTLS_CMAC_C

; Partition scheme (OTA support)
board_build.partitions = default.csv
